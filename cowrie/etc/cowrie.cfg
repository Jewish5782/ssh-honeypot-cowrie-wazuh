# Cowrie configuration — lab honeypot.
# Full reference: https://cowrie.readthedocs.io/en/latest/CONFIGURE.html

[honeypot]
hostname = srv-prod-01
# Make the fake shell convincing; attackers stay longer, you learn more.
log_path = var/log/cowrie
download_path = ${honeypot:state_path}/downloads
ttylog = true
# Do not let the honeypot be used to attack others:
forward_redirect = false

[shell]
# filesystem = share/cowrie/fs.pickle  (use default bundled virtual filesystem)

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.1

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

# --- Output plugins -------------------------------------------------------
# JSON is what Wazuh ingests. One event per line -> easy to decode.
[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = true

[output_textlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.log
format = text
