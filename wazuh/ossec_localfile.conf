<!--
  Add this <localfile> block to the Wazuh manager's /var/ossec/etc/ossec.conf
  (inside the <ossec_config> root) so the manager tails Cowrie's JSON log.
  scripts/setup.sh injects it automatically; shown here for reference.
-->
<localfile>
  <log_format>json</log_format>
  <location>/var/log/cowrie/cowrie.json</location>
</localfile>
